name: toolchain-recon

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      dsm_version:
        description: "DSM toolchain version"
        required: true
        default: "7.3-86009"
      toolkit_version:
        description: "DSM toolkit version"
        required: true
        default: "7.3"
      platform:
        description: "Synology platform"
        required: true
        default: "apollolake"
      toolchain_file:
        description: "Synology toolchain archive filename"
        required: true
        default: "apollolake-gcc1220_glibc236_x86_64-GPL.txz"
      download_toolchain:
        description: "Download toolchain/toolkit tarballs"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      DSM_VERSION: ${{ inputs.dsm_version || '7.3-86009' }}
      TOOLKIT_VERSION: ${{ inputs.toolkit_version || '7.3' }}
      SYNO_PLATFORM: ${{ inputs.platform || 'apollolake' }}
      TOOLCHAIN_FILE: ${{ inputs.toolchain_file || 'apollolake-gcc1220_glibc236_x86_64-GPL.txz' }}
      DOWNLOAD_TOOLCHAIN: ${{ inputs.download_toolchain || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          sh -n scripts/ci-toolchain-recon.sh
          sh -n scripts/plan-ci-toolchain-build.sh

      - name: Record Synology toolchain metadata
        run: |
          args=""
          if [ "${DOWNLOAD_TOOLCHAIN}" = "true" ]; then
            args="--download"
          fi
          sh scripts/ci-toolchain-recon.sh \
            --dsm-version "${DSM_VERSION}" \
            --toolkit-version "${TOOLKIT_VERSION}" \
            --platform "${SYNO_PLATFORM}" \
            --toolchain-file "${TOOLCHAIN_FILE}" \
            --output artifacts/ci-toolchain-recon \
            $args

      - name: Upload reconnaissance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-recon-${{ env.SYNO_PLATFORM }}-${{ env.DSM_VERSION }}
          path: artifacts/ci-toolchain-recon
          if-no-files-found: error
